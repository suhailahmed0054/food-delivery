services:
  - type: web
    name: al-arab-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /api/health/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: CUSTOMER_APP_URL
        value: https://al-arabrestaurant.cc.cd
      - key: ADMIN_APP_URL
        value: https://admin.al-arabrestaurant.cc.cd
      - key: API_PUBLIC_URL
        value: https://api.al-arabrestaurant.cc.cd
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: al-arab-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MENU_IMAGE_HOSTS
        value: images.unsplash.com,res.cloudinary.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: keyvalue
    name: al-arab-redis
    plan: starter
    ipAllowList: []
