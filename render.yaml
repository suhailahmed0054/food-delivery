services:
  - type: web
    name: al-arab-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /api/health/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: al-arab-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MENU_IMAGE_HOSTS
        value: images.unsplash.com
      - key: ALERT_WEBHOOK_URL
        sync: false

  - type: keyvalue
    name: al-arab-redis
    plan: starter
    ipAllowList: []
