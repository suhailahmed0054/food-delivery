<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b09" />
    <title>Al-Arab Restaurant</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;

        min-height: 100vh;

      <p>
